# 发布 Release：推送 v* 标签时自动触发（例如 git tag v1.2.0 && git push origin v1.2.0），
# 也可以在 Actions 页面手动运行并填写版本号。
#
# 流程：测试（Go 测试 + 浏览器端加密互通测试）与编译精简 ffmpeg（ffmpeg.yml）并行 → 构建前端
#       → 交叉编译各平台单文件，以及内置 ffmpeg 的服务端版本 → 生成校验和 → 发布 Release。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（会作为标签名，例如 v1.2.0）'
        required: true
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 ffmpeg（媒体相关的端到端测试需要）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: go vet
        run: go vet ./...

      - name: Go 测试
        run: go test -count=1 ./...

      - name: 前端依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: 浏览器端加密与 Go 服务端互通测试
        working-directory: web
        run: node tests/crypto-interop.mjs

  ffmpeg:
    name: 精简 ffmpeg
    uses: ./.github/workflows/ffmpeg.yml

  build:
    name: 构建并发布
    needs: [test, ffmpeg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z.+-]+$'; then
            echo "版本号格式不正确：$tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # 产出发布包的任务不使用依赖缓存，避免缓存投毒
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: 构建前端
        working-directory: web
        run: |
          npm ci --no-audit --no-fund && npx vite build
          if ! git diff --quiet -- ../internal/webui/dist || [ -n "$(git ls-files --others --exclude-standard -- ../internal/webui/dist)" ]; then
            echo "::warning::仓库里提交的前端产物（internal/webui/dist）不是最新的，发布包使用本次重新构建的版本。"
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-*
          path: ffbundle
          merge-multiple: true

      - name: 交叉编译
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # 重新构建的前端会让工作区显示为“有修改”，所以关闭自动写入的 VCS 信息，改为手动带上提交号
          full="$VERSION ($(git rev-parse --short=7 HEAD))"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 freebsd/amd64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/veilfin-$os-$arch"; [ "$os" = windows ] && out="$out.exe"
            echo "构建 $out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=7 \
              go build -trimpath -buildvcs=false -ldflags "-s -w -X 'main.version=$full'" -o "$out" ./cmd/veilfin
          done
          # 内置 ffmpeg 的服务端版本（只做常见的服务端平台）
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            cp "ffbundle/ffmpeg-$os-$arch.tar.gz" internal/media/ffbin/ffmpeg.tar.gz
            out="dist/veilfin-server-full-$os-$arch"; [ "$os" = windows ] && out="$out.exe"
            echo "构建 $out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -tags ffmpeg_embed -trimpath -buildvcs=false -ldflags "-s -w -X 'main.version=$full'" -o "$out" ./cmd/veilfin
          done
          rm internal/media/ffbin/ffmpeg.tar.gz
          ./dist/veilfin-linux-amd64 version
          ./dist/veilfin-server-full-linux-amd64 version
          ls -l dist
          cd dist && sha256sum veilfin-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 生成发布说明
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          {
            echo "## 下载"
            echo
            echo "| 平台 | 文件 |"
            echo "|---|---|"
            echo "| Windows x64 | \`veilfin-windows-amd64.exe\` |"
            echo "| Windows ARM64 | \`veilfin-windows-arm64.exe\` |"
            echo "| Linux x64 | \`veilfin-linux-amd64\` |"
            echo "| Linux ARM64 | \`veilfin-linux-arm64\` |"
            echo "| Linux ARMv7（树莓派等） | \`veilfin-linux-arm\` |"
            echo "| macOS Apple 芯片 | \`veilfin-darwin-arm64\` |"
            echo "| macOS Intel | \`veilfin-darwin-amd64\` |"
            echo "| FreeBSD x64 | \`veilfin-freebsd-amd64\` |"
            echo
            echo "服务端和本地客户端是同一个程序（\`veilfin server\` / \`veilfin client\`），服务端需要另外安装 ffmpeg。"
            echo
            echo "### 内置 ffmpeg 的服务端（免装 ffmpeg）"
            echo
            echo "| 平台 | 文件 |"
            echo "|---|---|"
            echo "| Linux x64 | \`veilfin-server-full-linux-amd64\` |"
            echo "| Linux ARM64 | \`veilfin-server-full-linux-arm64\` |"
            echo "| Windows x64 | \`veilfin-server-full-windows-amd64.exe\` |"
            echo
            ver=$(cat scripts/build-ffmpeg.sh | sed -n 's/^FFMPEG_VERSION=//p')
            echo "内置精简编译的 FFmpeg $ver（仅包含 Veilfin 用到的解码器和滤镜），首次启动时解压到数据目录的 \`bin/\` 下；"
            echo "用 \`-ffmpeg\` 参数可以改用其他 ffmpeg。本地客户端用不到 ffmpeg，请下载上面的普通版。"
            echo "FFmpeg 以 [LGPL 2.1](https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html) 许可发布，源码：https://ffmpeg.org/releases/ffmpeg-$ver.tar.xz ，"
            echo "编译方式见 [scripts/build-ffmpeg.sh](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/scripts/build-ffmpeg.sh)。"
            echo "下载后可以用 \`SHA256SUMS.txt\` 校验文件完整性：\`sha256sum -c SHA256SUMS.txt --ignore-missing\`。"
            echo
            echo "## 变更"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s (%h)' "$prev..HEAD"
            else
              git log --no-merges --pretty='- %s (%h)' HEAD
            fi
          } > release-notes.md
          cat release-notes.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease || contains(steps.ver.outputs.tag, '-') }}
        run: |
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 同一个标签重新运行：覆盖上传附件
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Veilfin $TAG" --notes-file release-notes.md --target "$GITHUB_SHA" $flags
          fi
